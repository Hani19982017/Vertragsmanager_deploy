services:
  - type: web
    name: vertragsmanager
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vertragsmanager-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5

databases:
  - name: vertragsmanager-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
